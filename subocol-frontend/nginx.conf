server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad: se declaran una sola vez a nivel de servidor para
    # que las hereden todos los `location` (nginx solo hereda `add_header` si el
    # nivel actual no define ninguno).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    # Archivos con hash en el nombre: se cachean un año.
    # Se usa `expires` (y no `add_header`) para no perder las cabeceras de
    # seguridad heredadas del nivel de servidor.
    location ~* \.(?:css|js|map|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Proxy inverso hacia el gateway: el navegador solo ve rutas relativas.
    location /api/ {
        proxy_pass http://gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback: cualquier ruta desconocida devuelve el shell de Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
